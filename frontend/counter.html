<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter — QMS</title>
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="conn-status"></div>

  <div class="counter-page">
    <header>
    <div>
      <div class="header-id" id="counter-id-label">—</div>
      <div class="counter-name" id="counter-name-label">—</div>
    </div>
    <div class="queue-status">
      <span class="dot" id="conn-dot"></span>
      <span id="queue-info"></span>
    </div>
  </header>

  <main>
    <div class="number-display">
      <div class="number-label">
        Now Serving
        <span class="badge lane-badge lane-priority" id="active-lane-badge" style="display:none;margin-left:0.5rem;vertical-align:middle">Priority</span>
      </div>
      <div class="number-value idle" id="active-number">—</div>
    </div>

    <!--
      Two modes share this page:
        Serving (Counter 1/2): Call Next · Call Priority · Send to Releasing · Done (No Release)
        Releasing Window (?c=3): Recall · Return to List · Mark as Released
      Wrappers marked data-mode="serving" / "releasing" are shown or hidden in render().
    -->
    <div class="actions">
      <div style="text-align:center" data-mode="serving">
        <button class="btn btn-call" id="btn-call" disabled>Call Next</button>
        <div class="key-hint" style="margin-top:0.5rem">
          <span class="key">Enter</span><span style="font-size:0.6rem;color:var(--color-neutral-800)">/</span><span class="key">Space</span>
        </div>
      </div>
      <div style="text-align:center" data-mode="serving">
        <button class="btn btn-call btn-priority" id="btn-priority" disabled>Call Priority</button>
        <div class="key-hint" style="margin-top:0.5rem">
          <span class="key">P</span>
        </div>
      </div>
      <div style="text-align:center" data-mode="serving">
        <button class="btn btn-outline" id="btn-send-release" disabled>Send to Releasing</button>
        <div class="key-hint" style="margin-top:0.5rem">
          <span class="key">S</span>
        </div>
      </div>
      <div style="text-align:center" data-mode="releasing">
        <button class="btn btn-call" id="btn-recall" disabled>Recall</button>
        <div class="key-hint" style="margin-top:0.5rem">
          <span class="key">R</span>
        </div>
      </div>
      <div style="text-align:center" data-mode="releasing">
        <!-- No keyboard shortcut on purpose: a stray keypress shouldn't bounce a client back. -->
        <button class="btn btn-outline" id="btn-return" disabled>Return to List</button>
      </div>
      <!-- Shared by both modes; only the label changes. -->
      <div style="text-align:center">
        <button class="btn btn-done" id="btn-done" disabled>Done (No Release)</button>
        <div class="key-hint" style="margin-top:0.5rem">
          <span class="key">D</span>
        </div>
      </div>
    </div>

    <!-- Releasing Window only: tickets waiting for their document, click to call. -->
    <div class="release-section" id="release-section" data-mode="releasing">
      <div class="others-label">Waiting for Release</div>
      <div class="release-grid" id="release-grid"></div>
    </div>

    <div class="others-section">
      <div class="others-label">All Counters</div>
      <div class="others-grid" id="others-grid"></div>
    </div>
  </main>

  <footer>
    <span class="dot on" id="status-dot" style="display:none"></span>
    <div id="toast"></div>
    <span id="total-served" style="font-family:var(--font-body);font-size:var(--font-size-body-xs);color:var(--color-neutral-800);margin-left:auto;"></span>
  </footer>

  <div class="not-started-overlay" id="not-started">
    <h2>Queue Not Started</h2>
    <p>Waiting for admin to start the queue…</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── Init ──────────────────────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const MY_ID = parseInt(params.get('c') || '1', 10);

    if (![1,2,3].includes(MY_ID)) {
      document.body.innerHTML = '<p style="padding:2rem;font-family:monospace;color:#ff4d4d">Invalid counter ID. Use ?c=1 or ?c=2 for the counters, or ?c=3 for the Releasing Window.</p>';
      throw new Error('invalid counter');
    }

    // Neutral placeholder; render() sets the real title once state arrives
    // (we don't know yet whether this is the Releasing Window).
    document.title = 'QMS';

    const socket = io();
    let state = {};
    let toastTimer = null;

    // ── Elements ──────────────────────────────────────────────────────────────
    const $connStatus  = document.getElementById('conn-status');
    const $connDot     = document.getElementById('conn-dot');
    const $counterIdLbl= document.getElementById('counter-id-label');
    const $counterName = document.getElementById('counter-name-label');
    const $activeNum   = document.getElementById('active-number');
    const $laneBadge   = document.getElementById('active-lane-badge');
    const $btnCall     = document.getElementById('btn-call');
    const $btnPriority = document.getElementById('btn-priority');
    const $btnDone     = document.getElementById('btn-done');
    const $btnSendRel  = document.getElementById('btn-send-release');
    const $btnRecall   = document.getElementById('btn-recall');
    const $btnReturn   = document.getElementById('btn-return');
    const $releaseGrid = document.getElementById('release-grid');
    const $modeBlocks  = document.querySelectorAll('[data-mode]');
    const $othersGrid  = document.getElementById('others-grid');
    const $toast       = document.getElementById('toast');
    const $totalServed = document.getElementById('total-served');
    const $notStarted  = document.getElementById('not-started');
    const $queueInfo   = document.getElementById('queue-info');

    // ── Connection ────────────────────────────────────────────────────────────
    socket.on('connect', () => {
      $connStatus.classList.add('connected');
      $connDot.classList.add('on');
    });

    socket.on('disconnect', () => {
      $connStatus.classList.remove('connected');
      $connDot.classList.remove('on');
    });

    socket.on('error', msg => showToast(msg));

    // ── State ─────────────────────────────────────────────────────────────────
    socket.on('state', newState => {
      const prevActive = state.activeNumbers?.[MY_ID];
      state = newState;
      render(prevActive);
    });

    function render(prevActive) {
      const counter = state.counters?.find(c => c.id === MY_ID);
      const myActive = state.activeNumbers?.[MY_ID];
      const hasActive = myActive !== undefined;
      const myLane = myActive?.lane || (typeof myActive === 'string' && myActive.startsWith('P') ? 'priority' : 'regular');
      const myDisplay = myActive?.display ?? myActive;
      const enabled = counter?.enabled ?? true;
      // The server tells us which counter is the Releasing Window.
      const isReleasing = MY_ID === state.releasingCounterId;
      const forRelease = state.forRelease || [];

      // Show only the controls for this counter's mode.
      const mode = isReleasing ? 'releasing' : 'serving';
      $modeBlocks.forEach(el => { el.hidden = el.dataset.mode !== mode; });

      // Overlay
      $notStarted.style.display = state.started ? 'none' : '';

      // Header + tab title: the Releasing Window is labelled by its role, not
      // its number. Set here (not at init) because releasingCounterId only
      // arrives with the first state payload.
      const label = isReleasing ? 'Releasing Window' : `Counter ${MY_ID}`;
      $counterIdLbl.textContent = label;
      document.title = `${label} — QMS`;
      $counterName.textContent = counter?.name || `Counter ${MY_ID}`;

      // Active number
      const numChanged = (myDisplay ?? '—') !== (prevActive?.display ?? prevActive ?? '—');
      if (hasActive) {
        $activeNum.textContent = myDisplay;
        $activeNum.classList.remove('idle');
        $activeNum.classList.toggle('is-priority', myLane === 'priority');
        $laneBadge.style.display = myLane === 'priority' ? '' : 'none';
        if (numChanged) {
          $activeNum.classList.remove('pop');
          void $activeNum.offsetWidth; // reflow
          $activeNum.classList.add('pop');
        }
      } else {
        $activeNum.textContent = '—';
        $activeNum.classList.add('idle');
        $activeNum.classList.remove('is-priority');
        $laneBadge.style.display = 'none';
      }

      // Buttons
      // These are convenience only: the server re-checks every rule, because
      // any LAN client could emit events directly.
      // Regular call is allowed if no active OR active is priority (auto-cancel + return priority).
      const canCall = !isReleasing && state.started && enabled && (!hasActive || myLane === 'priority');
      const canPriority = !isReleasing && state.started && enabled && !hasActive;
      $btnCall.disabled = !canCall;
      $btnPriority.disabled = !canPriority;
      $btnSendRel.disabled = isReleasing || !hasActive;
      $btnRecall.disabled = !isReleasing || !hasActive;
      $btnReturn.disabled = !isReleasing || !hasActive;
      $btnDone.disabled = !hasActive;
      $btnDone.textContent = isReleasing ? 'Mark as Released' : 'Done (No Release)';

      // Queue info
      if (!state.started) {
        $queueInfo.textContent = 'Idle';
      } else if (isReleasing) {
        $queueInfo.textContent = `Waiting for release: ${forRelease.length}`;
      } else {
        $queueInfo.textContent = `Next Regular: #${state.nextNumber} · Next Priority: P${state.nextPriority ?? 1}`;
      }

      // Waiting-for-release list (Releasing Window only).
      // Each ticket is a button; clicking it calls that client. Disabled while
      // a ticket is already active, since the window serves one client at a time.
      if (isReleasing) {
        $releaseGrid.innerHTML = '';
        if (!forRelease.length) {
          $releaseGrid.innerHTML = '<div class="release-empty">No one waiting.</div>';
        }
        forRelease.forEach(t => {
          const btn = document.createElement('button');
          btn.className = 'release-ticket' + (t.lane === 'priority' ? ' is-priority' : '');
          btn.textContent = t.display;
          btn.disabled = !state.started || !enabled || hasActive;
          btn.addEventListener('click', () => {
            socket.emit('release:call', { counterId: MY_ID, display: t.display });
          });
          $releaseGrid.appendChild(btn);
        });
      }

      // Others grid
      $othersGrid.innerHTML = '';
      (state.counters || []).forEach(c => {
        const active = state.activeNumbers?.[c.id];
        const isMe = c.id === MY_ID;
        const lane = active?.lane || (typeof active === 'string' && active.startsWith('P') ? 'priority' : 'regular');
        const display = active?.display ?? active;
        const card = document.createElement('div');
        card.className = [
          'other-card',
          active !== undefined ? 'has-active' : '',
          active !== undefined && lane === 'priority' ? 'priority-active' : '',
          isMe ? 'is-me' : '',
        ].join(' ');
        card.innerHTML = `
          <div class="other-card-name">${c.name}${isMe ? ' (you)' : ''}${!c.enabled ? ' ·off' : ''}</div>
          <div class="other-card-num ${active === undefined ? 'empty' : ''}">${display ?? '·'}</div>
        `;
        $othersGrid.appendChild(card);
      });

      // Total served
      $totalServed.textContent = `Served: ${state.completedNumbers?.length ?? 0}`;
    }

    // ── Actions ───────────────────────────────────────────────────────────────
    $btnCall.addEventListener('click', () => {
      socket.emit('counter:callNext', { counterId: MY_ID });
    });

    $btnPriority.addEventListener('click', () => {
      socket.emit('counter:callPriority', { counterId: MY_ID });
    });

    $btnDone.addEventListener('click', () => {
      socket.emit('counter:markDone', { counterId: MY_ID });
    });

    $btnSendRel.addEventListener('click', () => {
      socket.emit('counter:sendToRelease', { counterId: MY_ID });
    });

    $btnRecall.addEventListener('click', () => {
      socket.emit('release:recall', { counterId: MY_ID });
    });

    $btnReturn.addEventListener('click', () => {
      socket.emit('release:return', { counterId: MY_ID });
    });

    // ── Keyboard shortcuts ────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
      if ((e.key === 'Enter' || e.key === ' ') && !$btnCall.disabled) {
        e.preventDefault();
        socket.emit('counter:callNext', { counterId: MY_ID });
      }
      if ((e.key === 'p' || e.key === 'P') && !$btnPriority.disabled) {
        e.preventDefault();
        socket.emit('counter:callPriority', { counterId: MY_ID });
      }
      if (e.key === 'd' || e.key === 'D') {
        if (!$btnDone.disabled) socket.emit('counter:markDone', { counterId: MY_ID });
      }
      // The disabled checks also enforce mode: S is always disabled on the
      // Releasing Window, R is always disabled on Counter 1/2.
      if ((e.key === 's' || e.key === 'S') && !$btnSendRel.disabled) {
        e.preventDefault();
        socket.emit('counter:sendToRelease', { counterId: MY_ID });
      }
      if ((e.key === 'r' || e.key === 'R') && !$btnRecall.disabled) {
        e.preventDefault();
        socket.emit('release:recall', { counterId: MY_ID });
      }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $toast.classList.remove('show'), 3000);
    }
  </script>
  </div>
</body>
</html>
